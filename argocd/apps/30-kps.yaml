# Wave 3: Prometheus and Grafana (kube-prometheus-stack). This includes the Istio scrape config and the
# Istio dashboards (B2).
# ServerSideApply: the Prometheus Operator CRDs are bigger than the 256KB limit of the
# last-applied-configuration annotation that client-side apply writes, so they'd fail to sync without it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: meshmart
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.17.1
      helm:
        releaseName: kps
        valueFiles:
          - $values/platform/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/mr-anderson86/meshmart-istio-exam.git
      targetRevision: exam/mr-anderson86
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
