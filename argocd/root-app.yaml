# Bonus B7: the app-of-apps root. Apply it once by hand; from then on Argo CD manages everything in
# argocd/apps/ (the AppProject and one Application per component):
#
#   kubectl apply -f argocd/root-app.yaml
#
# Why app-of-apps instead of an ApplicationSet: sync waves only order resources inside ONE Application.
# This root syncs the child Application objects wave by wave. With the Application health check in
# platform/argocd-values.yaml, each wave waits until the previous wave's apps are Healthy.
#
# Everything syncs automatically, with self-heal. That's also what makes the waves work on a fresh
# cluster: a manual child would stay Missing, and the root would wait on it forever.
# - prune: true is safe here. No Application has the resources-finalizer, so pruning a child
#   Application never deletes its resources.
# - The two apps that ship CRDs (istio-base, kps) don't prune.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meshmart-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mr-anderson86/meshmart-istio-exam.git
    targetRevision: exam/mr-anderson86        # switch to HEAD once merged to main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
