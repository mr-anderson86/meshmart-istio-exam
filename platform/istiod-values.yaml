# Helm values for the istio/istiod chart (the control plane), sized for a laptop.
#
#   helm upgrade --install istiod istio/istiod -n istio-system \
#     --version "$ISTIO_VERSION" -f platform/istiod-values.yaml --wait
#
# Production would differ mainly here: replicaCount >= 2 with autoscaling and a
# PodDisruptionBudget, real resource requests, and a "revision" for canary upgrades.

pilot:
  replicaCount: 1
  autoscaleEnabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

meshConfig:
  accessLogFile: /dev/stdout        # Envoy access logs: kubectl logs <pod> -c istio-proxy

  # Bonus B4: tracing. Every sidecar sends its spans over OTLP/gRPC to the Jaeger release from
  # platform/jaeger-values.yaml (Service "jaeger" in namespace "tracing").
  extensionProviders:
    - name: jaeger
      opentelemetry:
        service: jaeger.tracing.svc.cluster.local
        port: 4317
  defaultProviders:
    # Setting defaultProviders replaces the chart's default (metrics: [prometheus]), so it has to
    # be listed again here, or the Istio metrics behind Prometheus, Grafana and Kiali disappear.
    metrics: [prometheus]
    tracing: [jaeger]               # mesh-wide, no Telemetry resource needed
  defaultConfig:
    tracing:
      sampling: 100                 # lab: trace every request (default 1%). Read when a sidecar starts, so restart pods

global:
  proxy:                            # every injected sidecar
    resources:
      requests:
        cpu: 10m
        memory: 40Mi
