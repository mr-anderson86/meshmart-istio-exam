# Helm values for the kiali-server chart, pointed at kube-prometheus-stack.
#
#   helm upgrade --install kiali-server kiali/kiali-server -n istio-system \
#     -f platform/kiali-values.yaml --wait
#
# The Prometheus URL assumes the kps release from kube-prometheus-stack-values.yaml:
#   kubectl -n monitoring get svc kps-prometheus
auth:
  strategy: anonymous            # lab only - never in production
external_services:
  prometheus:
    url: http://kps-prometheus.monitoring:9090
  # Bonus B2: Kiali looks up the Istio dashboards in Grafana by title and shows
  # "View in Grafana" links on service and workload pages.
  grafana:
    enabled: true
    internal_url: http://kps-grafana.monitoring:80   # used by the Kiali server to query Grafana
    external_url: http://localhost:3000              # used in links for the browser (the README's port-forward)
    auth:
      type: basic
      username: admin
      password: admin            # lab only; in production use a Grafana viewer token from a Secret
  # Bonus B4: Kiali queries Jaeger (platform/jaeger-values.yaml) and shows a Traces tab on
  # services and workloads, plus trace points on the latency charts.
  tracing:
    enabled: true
    provider: jaeger
    use_grpc: true
    internal_url: http://jaeger.tracing:16685        # Jaeger's gRPC query API, used by the Kiali server
    external_url: http://localhost:16686             # Jaeger UI for browser links (kubectl -n tracing port-forward svc/jaeger 16686)
