# BONUS path only: Kiali pointed at kube-prometheus-stack.
#   helm upgrade --install kiali-server kiali-server --repo https://kiali.org/helm-charts \
#     -n istio-system -f platform/kiali-values.yaml
# Check the Prometheus service name first:  kubectl -n monitoring get svc | grep prometheus
auth:
  strategy: anonymous            # lab only - never in production
external_services:
  prometheus:
    url: http://kps-prometheus.monitoring:9090
  grafana:
    enabled: false               # optional: wire Grafana links later if you like
  tracing:
    enabled: false
