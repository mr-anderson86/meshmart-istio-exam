# gateway -> catalog
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: catalog
  namespace: shop
spec:
  selector:
    matchLabels:
      app: catalog
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/shop/sa/gateway"]
      to:
        - operation:
            ports: ["8080"]
            methods: ["GET"]
            paths: ["/products"]
