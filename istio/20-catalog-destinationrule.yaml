# Named subsets of the catalog Service, selected by the version label the chart already sets.
# No trafficPolicy.tls here, so auto-mTLS keeps working under STRICT.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: catalog
  namespace: shop
spec:
  host: catalog.shop.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
