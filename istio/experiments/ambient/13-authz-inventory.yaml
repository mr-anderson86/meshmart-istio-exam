# EXPERIMENT (bonus B6 lab). Same name as istio/13-authz-inventory.yaml, so applying this replaces it.
# Same rule, but attached to the shop waypoint through the inventory Service (targetRefs) instead of
# selecting the pods. Methods and paths are L7, so only the waypoint can check them. The waypoint
# still sees the real caller's identity (sa/catalog). If this stayed selector-based, ztunnel would skip the
# L7 rule and deny ALL traffic to inventory. Apply it right after the pods restart without sidecars.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: inventory
  namespace: shop
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: inventory
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/shop/sa/catalog"]
      to:
        - operation:
            ports: ["8080"]
            methods: ["GET"]
            paths: ["/stock"]
