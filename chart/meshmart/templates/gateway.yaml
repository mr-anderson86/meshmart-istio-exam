apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  labels:
    {{- include "meshmart.labels" . | nindent 4 }}
    app: gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: meshmart-gateway
  labels:
    {{- include "meshmart.labels" . | nindent 4 }}
    app: gateway
data:
{{ (.Files.Glob "files/gateway/*").AsConfig | indent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-v1
  labels:
    {{- include "meshmart.labels" . | nindent 4 }}
    app: gateway
    version: v1
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
      version: v1
  template:
    metadata:
      labels:
        app: gateway
        version: v1
      annotations:
        checksum/config: {{ (.Files.Glob "files/gateway/*").AsConfig | sha256sum }}
    spec:
      serviceAccountName: gateway
      containers:
        - name: nginx
          image: {{ .Values.images.gateway }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: config
          configMap:
            name: meshmart-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "meshmart.labels" . | nindent 4 }}
    app: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
