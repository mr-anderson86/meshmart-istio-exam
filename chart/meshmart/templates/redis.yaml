{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  labels:
    {{- include "meshmart.labels" . | nindent 4 }}
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-v1
  labels:
    {{- include "meshmart.labels" . | nindent 4 }}
    app: redis
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      version: v1
  template:
    metadata:
      labels:
        app: redis
        version: v1
    spec:
      serviceAccountName: redis
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
          ports:
            - name: tcp-redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "meshmart.labels" . | nindent 4 }}
    app: redis
    {{- with .Values.redis.serviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    app: redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: tcp-redis
      appProtocol: tcp
{{- end }}
