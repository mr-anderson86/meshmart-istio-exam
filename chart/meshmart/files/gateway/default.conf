# MeshMart API gateway (plain nginx).
# Serves the UI and proxies /api/* to the backend Kubernetes Services.

server {
    listen 8080;
    server_name _;

    # Which gateway pod answered (handy when you scale the gateway).
    add_header X-Served-By $hostname always;

    # Upstream settings shared by every /api route.
    # NOTE: proxy_http_version 1.1 is not decoration — see written question W3.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Public API
    location = /api/catalog   { proxy_pass http://catalog:8080/products; }
    location = /api/orders    { proxy_pass http://orders:8080/checkout; }

    # "Internal" endpoints that the gateway SHOULD NOT be allowed to reach
    # once you have locked the mesh down (they exist so you can prove it).
    location = /api/inventory { proxy_pass http://inventory:8080/stock; }
    location = /api/payments  { proxy_pass http://payments:8080/charge; }
}
